<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Signal Cut: two broken rails + angled intercept bar -->
  <!-- Rail 1 left segment -->
  <line x1="5" y1="23" x2="24" y2="23" stroke="#00e87a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rail 1 right segment -->
  <line x1="39" y1="23" x2="59" y2="23" stroke="#00e87a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rail 2 left segment -->
  <line x1="5" y1="41" x2="26" y2="41" stroke="#00e87a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rail 2 right segment -->
  <line x1="41" y1="41" x2="59" y2="41" stroke="#00e87a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Intercept bar: angled, fills the cut -->
  <rect x="27" y="9" width="10" height="46" rx="3" fill="#00e87a"
        transform="rotate(-7 32 32)"/>
</svg>
